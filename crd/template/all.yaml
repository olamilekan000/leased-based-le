apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appconfigs.example.com
spec:
  group: example.com
  names:
    kind: AppConfig
    plural: appconfigs
    shortNames:
    - acfg
    singular: appconfig
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              appName:
                type: string
              configMapRef:
                description: Reference to the ConfigMap holding configuration.
                type: string
              environment:
                items:
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
              image:
                description: The Docker image for the application.
                type: string
              replicas:
                default: 1
                maximum: 100
                minimum: 1
                type: integer
            required:
            - appName
            - image
            type: object
          status:
            properties:
              availableReplicas:
                type: integer
              updatedReplicas:
                type: integer
            type: object
        type: object
    served: true
    storage: true
---
